name: PR 32 Word diagnosis

on:
  pull_request:
    branches: [codex/main-integration-validation]

permissions:
  contents: read
  actions: read

jobs:
  macos-startup:
    if: github.head_ref == 'codex/pr32-e2e-stability' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workbench-runtime
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app-macos
          run-id: 44456339835
          github-token: ${{ github.token }}
      - run: |
          mkdir e2e-app
          tar -xzf oleafly-e2e-macos.tar.gz -C e2e-app
          pnpm exec playwright install chromium
      - name: Run the four startup regressions with a one-shot Python stack dump
        env:
          OLEAFLY_E2E_APP_BINARY: ${{ github.workspace }}/e2e-app/Oleafly.app/Contents/MacOS/Oleafly
        run: |
          export OLEAFLY_PROBE_PYTHON="$OLEAFLY_WORKBENCH_PYTHON"
          export OLEAFLY_WORKBENCH_PYTHON="$RUNNER_TEMP/workbench-python-probe"
          install -m 755 scripts/ci/workbench-python-probe.sh "$OLEAFLY_WORKBENCH_PYTHON"
          ./scripts/e2e.sh --retries=0 e2e/tests/{116-journal-checks,123-journal-annotations,124-journal-subscriptions,128-docx-task-activity}.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-workbench-startup
          path: |
            test-results/**/*.log
            test-results/**/error-context.md
            e2e-artifacts/**/*.log
            e2e-artifacts/**/error-context.md
          retention-days: 7

  windows-render:
    if: github.head_ref == 'codex/pr32-e2e-stability' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workbench-runtime
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app-windows
          run-id: 44456339835
          github-token: ${{ github.token }}
      - id: unpack
        shell: bash
        run: bash scripts/ci/unpack-windows-e2e-app.sh oleafly-e2e-windows.tar.gz e2e-app
      - run: pnpm exec playwright install chromium
      - name: Run the original DOCX fixture
        id: original
        continue-on-error: true
        shell: pwsh
        env:
          OLEAFLY_E2E_APP_BINARY: ${{ steps.unpack.outputs.binary }}
        run: |
          $spec = 'e2e/tests/128-docx-task-activity.spec.ts'
          git restore --source=71ee74d7b217769c064feeaa9db178e7149a843a -- $spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -File scripts/e2e.ps1 --retries=0 $spec
          $result = $LASTEXITCODE
          git restore -- $spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $result
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-original-docx
          path: |
            test-results/**/*.log
            test-results/**/error-context.md
            e2e-artifacts/**/*.log
            e2e-artifacts/**/error-context.md
          retention-days: 7
      - name: Run the styled DOCX fixture
        shell: pwsh
        env:
          OLEAFLY_E2E_APP_BINARY: ${{ steps.unpack.outputs.binary }}
        run: powershell -File scripts/e2e.ps1 --retries=0 e2e/tests/128-docx-task-activity.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-styled-docx
          path: |
            test-results/**/*.log
            test-results/**/error-context.md
            e2e-artifacts/**/*.log
            e2e-artifacts/**/error-context.md
          retention-days: 7
