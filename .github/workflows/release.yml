name: Release

#
#     git tag v0.1.0 && git push origin v0.1.0
#
# or run manually from the Actions tab (provide the tag to attach to).
#
# A tag build always stops at a complete, verified DRAFT: every platform is
# built and the artifact and updater-feed checks still run, but the release is
# never flipped live. Publishing writes latest.json - the updater feed - which
# installed clients pick up automatically, and that cannot be undone. So it is
# a deliberate second step: re-run this workflow from the Actions tab for the
# same tag with "Publish the release" checked.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build & attach the release to (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish the release. Leave unchecked to build a draft for review."
        required: false
        default: false
        type: boolean

permissions:
  contents: write # tauri-action needs this to create the release & upload assets

env:
  RELEASE_TARGETS: >-
    aarch64-apple-darwin
    x86_64-apple-darwin
    x86_64-unknown-linux-gnu
    aarch64-unknown-linux-gnu
    x86_64-pc-windows-msvc

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The 0.2.8 build graph exceeds Node's default ~4GB heap during vite
      # build on the 7GB macOS arm64 runners.
      NODE_OPTIONS: --max-old-space-size=6144
      # Public artifacts must not contain PyMuPDF/MuPDF until a checked release
      # policy establishes the exact corresponding-source or commercial terms.
      OLEAFLY_WORKBENCH_BUNDLE_POLICY: public-unbundled
      OLEAFLY_WORKBENCH_TARGET: ${{ matrix.rust_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the macos-14 image on 2026-11-02. The macOS-only
          # steps below check runner.os, not this label, so the next image
          # change can't silently skip signing and notarization.
          - name: macOS (Apple Silicon)
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Macs are cross-compiled on the Apple Silicon runner, the same
          # way release-cli.yml builds the Intel CLI. Rosetta runs the x86_64
          # sidecars for the smoke tests.
          - name: macOS (Intel)
            os: macos-15
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: Linux (x86_64)
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          - name: Windows (x86_64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # xdg-utils: with a deep-link scheme in tauri.conf.json the AppImage
      # bundler runs /usr/bin/xdg-mime. ubuntu-22.04 ships it, the
      # ubuntu-24.04-arm image does not.
      - name: Install Linux system dependencies (Tauri)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            xdg-utils \
            build-essential \
            curl wget file

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # pnpm 11 requires Node >= 22.13 (see package.json `packageManager`).
          node-version: 22
          cache: pnpm

      # Not the local ./.github/actions/rust-toolchain: a manual run can check
      # out a tag from before the pin existed, where neither that action nor
      # rust-toolchain.toml is in the tree. Those tags were built with the
      # stable of their day, so they fall back to stable.
      - name: Resolve the Rust toolchain for this ref
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          channel="stable"
          if [ -f rust-toolchain.toml ]; then
            channel="$(awk -F'"' '/^[ \t]*channel[ \t]*=/ { print $2; exit }' rust-toolchain.toml)"
            if [[ ! "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error file=rust-toolchain.toml::expected channel = \"<major>.<minor>.<patch>\", found '${channel}'"
              cat rust-toolchain.toml
              exit 1
            fi
          fi
          echo "Building with Rust ${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target
          # Both macOS legs run on the same arm64 host, so the automatic key
          # alone would give them one shared cache.
          key: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A manual dispatch can check out an older tag while this workflow comes
      # from the current branch. Gate every current-tree helper on files or
      # package scripts that actually exist in that tag.
      - name: Detect checked-out release capabilities
        id: capabilities
        shell: bash
        run: |
          set -euo pipefail
          has_script() {
            node -e 'const p=require("./package.json"); process.exit(p.scripts?.[process.argv[1]] ? 0 : 1)' "$1" >/dev/null 2>&1
          }
          before_build_uses_workbench() {
            node -e 'const c=require("./src-tauri/tauri.conf.json"); process.exit(c.build?.beforeBuildCommand?.includes("tauri:before-build") ? 0 : 1)' >/dev/null 2>&1
          }

          workbench_bundle=false
          if [ -f services/research-workbench/pyproject.toml ] \
            && [ -f scripts/build-workbench.mjs ] \
            && [ -f scripts/test-workbench-bundle.mjs ] \
            && [ -f src-tauri/tauri.macos.conf.json ] \
            && has_script workbench:bundle \
            && has_script tauri:before-build \
            && before_build_uses_workbench; then
            workbench_bundle=true
          fi
          workbench_engine=false
          if [ "$workbench_bundle" = true ] \
            && [ "${OLEAFLY_WORKBENCH_BUNDLE_POLICY:-local}" != public-unbundled ]; then
            workbench_engine=true
          fi

          language_server_tests=false
          if has_script language-servers:test; then
            language_server_tests=true
          fi
          stage_tinymist=false
          if [ -f scripts/fetch-language-servers.mjs ] \
            && grep -q -- '--install-mode' scripts/fetch-language-servers.mjs \
            && grep -q 'tinymist' scripts/fetch-language-servers.mjs; then
            stage_tinymist=true
          fi
          sign_tinymist=false
          if [ "$stage_tinymist" = true ] \
            && [ -f scripts/sign-bundled-tinymist.mjs ]; then
            sign_tinymist=true
          fi

          fetch_tectonic=false
          [ -f scripts/fetch-tectonic.sh ] && fetch_tectonic=true
          fetch_biber=false
          [ -f scripts/fetch-biber.sh ] && fetch_biber=true
          fetch_typst=false
          [ -f scripts/fetch-typst.sh ] && fetch_typst=true
          fetch_pandoc=false
          [ -f scripts/fetch-pandoc.sh ] && fetch_pandoc=true
          stage_vcruntime=false
          [ -f scripts/stage-windows-vcruntime.mjs ] && stage_vcruntime=true
          smoke_typst=false
          if [ "$fetch_typst" = true ] && [ -f scripts/smoke-typst.sh ]; then
            smoke_typst=true
          fi
          smoke_markdown=false
          if [ "$fetch_pandoc" = true ] \
            && [ "$fetch_tectonic" = true ] \
            && [ -f scripts/smoke-markdown.sh ]; then
            smoke_markdown=true
          fi
          changelog_extract=false
          [ -f scripts/changelog-extract.sh ] && changelog_extract=true

          {
            echo "workbench_bundle=$workbench_bundle"
            echo "workbench_engine=$workbench_engine"
            echo "language_server_tests=$language_server_tests"
            echo "stage_tinymist=$stage_tinymist"
            echo "sign_tinymist=$sign_tinymist"
            echo "fetch_tectonic=$fetch_tectonic"
            echo "fetch_biber=$fetch_biber"
            echo "fetch_typst=$fetch_typst"
            echo "fetch_pandoc=$fetch_pandoc"
            echo "stage_vcruntime=$stage_vcruntime"
            echo "smoke_typst=$smoke_typst"
            echo "smoke_markdown=$smoke_markdown"
            echo "changelog_extract=$changelog_extract"
          } >> "$GITHUB_OUTPUT"

      - name: Install Workbench bundle runtime
        if: matrix.rust_target == 'aarch64-apple-darwin' && steps.capabilities.outputs.workbench_engine == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/research-workbench/pyproject.toml

      - name: Install Workbench bundle dependencies
        if: matrix.rust_target == 'aarch64-apple-darwin' && steps.capabilities.outputs.workbench_engine == 'true'
        working-directory: services/research-workbench
        run: python -m pip install -e ".[bundle]"

      - name: Validate language-server manifest and fetch confinement
        if: steps.capabilities.outputs.language_server_tests == 'true'
        run: pnpm language-servers:test

      # Fetch the Tectonic LaTeX-compiler sidecar for the build target. Tauri
      # bundles it (bundle.externalBin) so the shipped app compiles offline.
      - name: Fetch checksum-pinned Tectonic sidecar
        if: steps.capabilities.outputs.fetch_tectonic == 'true'
        shell: bash
        run: bash scripts/fetch-tectonic.sh ${{ matrix.rust_target }}

      # Biber 2.17 matched to Tectonic's biblatex; declared as externalBin
      # tectonic-biber. Missing here breaks the Tauri bundler on release.
      - name: Fetch checksum-pinned Biber sidecar
        if: steps.capabilities.outputs.fetch_biber == 'true'
        shell: bash
        run: bash scripts/fetch-biber.sh ${{ matrix.rust_target }}

      - name: Stage checksum-pinned Tinymist resource archive
        if: steps.capabilities.outputs.stage_tinymist == 'true'
        shell: bash
        run: node scripts/fetch-language-servers.mjs --server tinymist --target ${{ matrix.rust_target }} --install-mode resource

      # Notarization walks inside bundled archives, and upstream ships Tinymist
      # unsigned. Sign it before Tauri bundles the resource, or the whole app is
      # rejected. No-op on other platforms and on unsigned builds.
      - name: Sign the bundled Tinymist binary (macOS)
        if: runner.os == 'macOS' && steps.capabilities.outputs.sign_tinymist == 'true'
        shell: bash
        env:
          SIGN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Read straight from secrets rather than the environment: the step
          # that exports APPLE_SIGNING_IDENTITY into $GITHUB_ENV runs after this
          # one, so relying on it meant signing was silently skipped.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_APPLE_CERTIFICATE:-}" ]; then
            echo "no signing certificate; leaving the archive as fetched"
            exit 0
          fi
          # tauri-action imports the certificate into a keychain of its own, but
          # that happens in the build step below - after this one. Import into a
          # short-lived keychain here so codesign can resolve the identity now,
          # then remove it and restore the search list so tauri-action's own
          # setup is unaffected.
          KEYCHAIN="$RUNNER_TEMP/oleafly-tinymist.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | sed 's/["[:space:]]//g' | tr '\n' ' ')"
          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            # shellcheck disable=SC2086
            security list-keychains -d user -s $ORIGINAL_KEYCHAINS 2>/dev/null || true
          }
          trap cleanup EXIT
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          CERT="$RUNNER_TEMP/tinymist-signing.p12"
          printf '%s' "$SIGN_APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" \
            -P "$SIGN_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL_KEYCHAINS
          node scripts/sign-bundled-tinymist.mjs --target ${{ matrix.rust_target }}

      - name: Fetch Typst sidecar
        if: steps.capabilities.outputs.fetch_typst == 'true'
        shell: bash
        run: bash scripts/fetch-typst.sh ${{ matrix.rust_target }}

      - name: Stage the Microsoft VC++ runtime that Typst and TexLab need
        if: matrix.os == 'windows-latest' && steps.capabilities.outputs.stage_vcruntime == 'true'
        run: node scripts/stage-windows-vcruntime.mjs

      # Pandoc powers the ad-hoc document converters. Shipping the pinned
      # sidecar keeps every conversion available when the app is offline.
      - name: Fetch checksum-pinned Pandoc sidecar
        if: steps.capabilities.outputs.fetch_pandoc == 'true'
        shell: bash
        run: |
          bash scripts/fetch-pandoc.sh ${{ matrix.rust_target }}
          test -f src-tauri/resources/licenses/pandoc-3.9.0.2-COPYING.md

      - name: Install Rosetta for the Intel smoke tests
        if: matrix.rust_target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is already installed"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
            /usr/bin/arch -x86_64 /usr/bin/true
          fi

      - name: Smoke-test Typst sidecar
        if: steps.capabilities.outputs.smoke_typst == 'true'
        shell: bash
        run: bash scripts/smoke-typst.sh ${{ matrix.rust_target }}

      # The Markdown smoke compile makes Tectonic fetch TeX packages from
      # relay.fullyjustified.net, which rate-limits GitHub runners (HTTP 429).
      # Restoring the package cache keeps warm runs off that host entirely;
      # the key scheme matches ci.yml so the Linux job can reuse CI's cache.
      - name: Cache Tectonic packages for the Markdown smoke test
        if: steps.capabilities.outputs.smoke_markdown == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Tectonic
            ~/Library/Caches/Tectonic
            ~\AppData\Local\TectonicProject\Tectonic
          key: tectonic-pkgs-md-v1-${{ matrix.rust_target }}-${{ hashFiles('scripts/fixtures/markdown-smoke.md', 'scripts/fetch-tectonic.sh') }}
          restore-keys: tectonic-pkgs-md-v1-${{ matrix.rust_target }}-

      - name: Smoke-test managed Pandoc with packaged Tectonic input
        if: steps.capabilities.outputs.smoke_markdown == 'true'
        shell: bash
        run: bash scripts/smoke-markdown.sh ${{ matrix.rust_target }}

      # macOS code signing + notarization. Every APPLE_* value is exported only
      # when its secret exists: an empty env var would make the bundler attempt
      # signing with an empty identity, whereas absent vars mean "unsigned
      # build" (still succeeds, for forks and for before certs are set up).
      # See docs/signing.md for the one-time account/certificate setup.
      - name: Enable macOS signing & notarization (when secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_env() {
            local name="$1" value="$2"
            [ -n "$value" ] || return 0
            {
              echo "${name}<<OLEAFLY_SECRET_EOF"
              echo "$value"
              echo "OLEAFLY_SECRET_EOF"
            } >> "$GITHUB_ENV"
          }
          export_env APPLE_CERTIFICATE "$SECRET_APPLE_CERTIFICATE"
          export_env APPLE_CERTIFICATE_PASSWORD "$SECRET_APPLE_CERTIFICATE_PASSWORD"
          export_env APPLE_SIGNING_IDENTITY "$SECRET_APPLE_SIGNING_IDENTITY"
          export_env APPLE_ID "$SECRET_APPLE_ID"
          export_env APPLE_PASSWORD "$SECRET_APPLE_PASSWORD"
          export_env APPLE_TEAM_ID "$SECRET_APPLE_TEAM_ID"
          if [ -n "$SECRET_APPLE_CERTIFICATE" ]; then
            export_env KEYCHAIN_PASSWORD "$(openssl rand -hex 24)"
            echo "macOS signing: enabled"
          else
            echo "macOS signing: secrets not set, building unsigned"
          fi

      # Windows Authenticode via Azure Trusted/Artifact Signing (~$10/month,
      # no certificate files to manage). Activated only when the AZURE_*
      # secrets exist; otherwise the build stays unsigned. docs/signing.md
      # covers the Azure account, signing account, and app-registration setup.
      - name: Enable Windows signing (when secrets exist)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SECRET_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SECRET_AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SECRET_AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SECRET_AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$SECRET_AZURE_CLIENT_ID" ]; then
            echo "Windows signing: secrets not set, building unsigned"
            exit 0
          fi
          if [ -z "$SECRET_AZURE_SIGNING_ENDPOINT" ] || [ -z "$SECRET_AZURE_SIGNING_ACCOUNT" ] || [ -z "$SECRET_AZURE_SIGNING_PROFILE" ]; then
            echo "Windows signing: AZURE_CLIENT_ID is set but endpoint/account/profile secrets are missing" >&2
            exit 1
          fi
          cargo install artifact-signing-cli
          printf '{"bundle":{"windows":{"signCommand":"artifact-signing-cli -e %s -a %s -c %s -d Oleafly %%1"}}}' \
            "$SECRET_AZURE_SIGNING_ENDPOINT" "$SECRET_AZURE_SIGNING_ACCOUNT" "$SECRET_AZURE_SIGNING_PROFILE" \
            > src-tauri/tauri.windows-signing.conf.json
          echo 'TAURI_SIGN_ARGS=--config src-tauri/tauri.windows-signing.conf.json' >> "$GITHUB_ENV"
          echo "Windows signing: enabled"

      - name: Preflight the public Workbench bundle policy
        if: contains(matrix.rust_target, '-apple-darwin') && steps.capabilities.outputs.workbench_bundle == 'true' && steps.capabilities.outputs.workbench_engine != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-workbench.mjs
          test ! -e src-tauri/resources/research-workbench/rfw-workbench
          test ! -L src-tauri/resources/research-workbench/rfw-workbench
          if find src-tauri/resources/research-workbench \
            \( -iname '*mupdf*' -o -iname '*pymupdf*' \) -print -quit | grep -q .; then
            echo "public staging unexpectedly contains a MuPDF/PyMuPDF file" >&2
            exit 1
          fi

      # Build the release notes from CHANGELOG.md so both the GitHub Release and
      # the updater's `notes` say what changed. tauri-action copies
      # `releaseBody` into `latest.json`.
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## What's new in ${VERSION#v}"
            echo ""
            if [ "${{ steps.capabilities.outputs.changelog_extract }}" = true ]; then
              bash scripts/changelog-extract.sh "$VERSION"
            else
              awk -v version="${VERSION#v}" '
                $0 ~ ("^## \\[" version "\\]") { capture = 1; next }
                capture && /^## / { exit }
                capture { print }
              ' CHANGELOG.md
            fi
            if [ "${{ steps.capabilities.outputs.workbench_bundle }}" = true ] \
              && [ "${{ steps.capabilities.outputs.workbench_engine }}" != true ]; then
              echo ""
              echo "**Word and Journal checks:** This public build does not include the Workbench engine. It cannot open managed Word working copies or run Journal checks, and it will not reuse a configured Python. Before upgrading, export any drafts you need and back up your \`journal-library\` directory. The upgrade does not migrate or remove it."
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Downloads:** grab your platform's installer below (macOS Apple Silicon or Intel \`.dmg\`, Windows x86_64 \`.msi\` / \`-setup.exe\`, Linux x86_64 or ARM64 \`.AppImage\` / \`.deb\` / \`.rpm\`)."
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Leave the RPM out of pre-release Linux builds
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          case "$version" in
            *-*)
              echo 'TAURI_BUNDLE_ARGS=--bundles appimage,deb' >> "$GITHUB_ENV"
              echo "RPM: skipped for pre-release $version"
              ;;
            *) echo "RPM: built for $version" ;;
          esac

      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and generates `latest.json`. Set these
          # repo secrets (see docs/updates.md); without them the build still
          # succeeds but produces no auto-update feed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure credentials for Windows Authenticode signing; empty when the
          # signing secrets aren't configured (artifact-signing-cli only runs
          # when the signCommand overlay was written by the step above).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Public GitLab OAuth application id; empty keeps GitLab on access tokens.
          OLEAFLY_DESKTOP_GITLAB_CLIENT_ID: ${{ vars.OLEAFLY_DESKTOP_GITLAB_CLIENT_ID }}
          # Google OAuth desktop client for Drive sync; empty hides Google Drive.
          OLEAFLY_GOOGLE_CLIENT_ID: ${{ secrets.OLEAFLY_GOOGLE_CLIENT_ID }}
          OLEAFLY_GOOGLE_CLIENT_SECRET: ${{ secrets.OLEAFLY_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Oleafly ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Matrix jobs concurrently merge latest.json on the draft release.
          # Retries handle transient delete/upload conflicts; the finalize job
          # below performs a deterministic target-owned merge before release.
          retryAttempts: 3
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }} ${{ env.TAURI_BUNDLE_ARGS }}

      - name: Verify packaged Workbench engine
        if: matrix.rust_target == 'aarch64-apple-darwin' && steps.capabilities.outputs.workbench_engine == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          engine="$app/Contents/Resources/resources/research-workbench/rfw-workbench"
          framework="$app/Contents/Resources/resources/research-workbench/_internal/Python.framework"
          test -x "$engine"
          file "$engine" | grep -q 'arm64'
          codesign --verify --strict "$engine"
          codesign --verify --strict "$framework"
          OLEAFLY_WORKBENCH_BUNDLE="$engine" node scripts/test-workbench-bundle.mjs

      - name: Verify the public app has no Workbench engine
        if: contains(matrix.rust_target, '-apple-darwin') && steps.capabilities.outputs.workbench_bundle == 'true' && steps.capabilities.outputs.workbench_engine != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          engine_root="$app/Contents/Resources/resources/research-workbench"
          test ! -e "$engine_root/rfw-workbench"
          test ! -L "$engine_root/rfw-workbench"
          if find "$app" \( -iname '*mupdf*' -o -iname '*pymupdf*' \) -print -quit | grep -q .; then
            echo "public app unexpectedly contains a bundled MuPDF/PyMuPDF file" >&2
            exit 1
          fi
          echo "public app contains no Workbench engine or bundled MuPDF"

      # Work with byte-for-byte copies of the files tauri-action uploaded to
      # the draft release. This keeps provenance and SBOM subjects aligned with
      # what users will actually download, regardless of target output layout.
      - name: Stage release artifacts for supply-chain metadata
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const destination = path.resolve("release-subjects");
          const sbomInput = path.resolve("sbom-input");
          fs.mkdirSync(destination, { recursive: true });
          fs.mkdirSync(path.join(sbomInput, "artifacts"), { recursive: true });
          fs.mkdirSync("sbom", { recursive: true });
          const seenSources = new Set();
          const seen = new Set();
          for (const artifact of JSON.parse(process.env.ARTIFACT_PATHS)) {
            let source = path.resolve(artifact);
            // tauri-action reports the macOS .app directory before converting
            // it to the .tar.gz file that is actually uploaded to the release.
            if (fs.statSync(source).isDirectory() && fs.existsSync(`${source}.tar.gz`)) {
              source = `${source}.tar.gz`;
            }
            if (!fs.statSync(source).isFile()) {
              throw new Error(`release artifact is not a file: ${source}`);
            }
            source = fs.realpathSync(source);
            if (seenSources.has(source)) continue;
            seenSources.add(source);
            const name = path.basename(source);
            if (seen.has(name)) {
              throw new Error(`duplicate release artifact name: ${name}`);
            }
            seen.add(name);
            fs.copyFileSync(source, path.join(destination, name));
            fs.copyFileSync(source, path.join(sbomInput, "artifacts", name));
          }
          if (seen.size === 0) {
            throw new Error("tauri-action did not report any release artifacts");
          }

          const workspace = process.cwd();
          const copyInput = (source) => {
            const relative = path.relative(workspace, source);
            const target = path.join(sbomInput, relative);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(source, target);
          };
          for (const name of ["package.json", "pnpm-lock.yaml", "Cargo.toml", "Cargo.lock"]) {
            copyInput(path.join(workspace, name));
          }
          const optionalInput = (source) => {
            if (fs.existsSync(source)) copyInput(source);
          };
          optionalInput(path.join(workspace, "services", "research-workbench", "pyproject.toml"));
          const collectManifests = (directory) => {
            if (!fs.existsSync(directory)) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === "node_modules" || entry.name === "target") continue;
              const item = path.join(directory, entry.name);
              if (entry.isDirectory()) collectManifests(item);
              if (entry.isFile() && (entry.name === "package.json" || entry.name === "Cargo.toml")) {
                copyInput(item);
              }
            }
          };
          for (const root of ["packages", "crates", "src-tauri"]) {
            collectManifests(path.join(workspace, root));
          }
          NODE

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-subjects/*

      - name: Generate platform SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Scan the shipped files plus the locked Rust and pnpm dependency
          # manifests; scanning installers alone misses statically linked crates.
          path: sbom-input
          format: spdx-json
          output-file: sbom/Oleafly-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.rust_target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-subjects/*
          sbom-path: sbom/Oleafly-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.rust_target }}.spdx.json

      - name: Attest SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom/Oleafly-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.rust_target }}.spdx.json

      - name: Preserve platform SBOM
        uses: actions/upload-artifact@v7
        with:
          name: release-sbom-${{ matrix.rust_target }}
          path: sbom/Oleafly-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.rust_target }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve this target's updater fragment
        uses: actions/upload-artifact@v7
        with:
          name: updater-fragment-${{ matrix.rust_target }}
          path: latest.json
          if-no-files-found: error
          retention-days: 2

      - name: Verify staged compiler sidecars and Tinymist resource policy
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
          FETCH_TECTONIC: ${{ steps.capabilities.outputs.fetch_tectonic }}
          FETCH_BIBER: ${{ steps.capabilities.outputs.fetch_biber }}
          FETCH_TYPST: ${{ steps.capabilities.outputs.fetch_typst }}
          FETCH_PANDOC: ${{ steps.capabilities.outputs.fetch_pandoc }}
          STAGE_VCRUNTIME: ${{ steps.capabilities.outputs.stage_vcruntime }}
        run: |
          set -euo pipefail
          if [ "${{ steps.capabilities.outputs.stage_tinymist }}" = true ]; then
            node scripts/fetch-language-servers.mjs --check --server tinymist --target "$TARGET" --install-mode resource
          fi
          # Legs built with --target put their binaries under target/<triple>.
          if [[ "$TARGET" == *-apple-darwin || "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
            RUNTIME_DIR="src-tauri/target/$TARGET/release"
          elif [[ "$TARGET" == *windows* ]]; then
            RUNTIME_DIR="src-tauri/target/release"
          else
            RUNTIME_DIR="src-tauri/target/release"
          fi
          SUFFIX=""
          if [[ "$TARGET" == *windows* ]]; then SUFFIX=".exe"; fi
          require_sidecar() {
            local enabled="$1" name="$2"
            if [ "$enabled" = true ]; then
              test -f "$RUNTIME_DIR/$name$SUFFIX"
            fi
          }
          require_sidecar "$FETCH_TECTONIC" tectonic
          require_sidecar "$FETCH_BIBER" tectonic-biber
          require_sidecar "$FETCH_TYPST" typst
          require_sidecar "$FETCH_PANDOC" pandoc
          if [ "${{ steps.capabilities.outputs.stage_tinymist }}" = true ]; then
            test ! -e "$RUNTIME_DIR/tinymist$SUFFIX"
          fi
          if [ "$STAGE_VCRUNTIME" = true ] && [[ "$TARGET" == *windows* ]]; then
            test -f "$RUNTIME_DIR/vcruntime140.dll"
          fi

      - name: Describe the Linux desktop entries (diagnostic only)
        if: startsWith(matrix.os, 'ubuntu-')
        continue-on-error: true
        shell: bash
        run: |
          for bundle in "src-tauri/target/${{ matrix.rust_target }}/release/bundle" "src-tauri/target/release/bundle"; do
            [ -d "$bundle" ] || continue
            echo "bundle folder: $bundle"
            for deb in "$bundle"/deb/*.deb; do
              [ -f "$deb" ] || continue
              echo "--- $deb ---"
              root="$(mktemp -d)"
              dpkg-deb -x "$deb" "$root" || echo "(could not unpack the package)"
              for entry in "$root"/usr/share/applications/*.desktop "$root"/usr/share/kio/servicemenus/*.desktop "$root"/usr/share/nemo/actions/*.nemo_action; do
                [ -f "$entry" ] || continue
                echo "${entry#"$root"}:"
                grep -E '^(Type|Exec|MimeType)=' "$entry" || echo "(no Type, Exec or MimeType line)"
              done
              rm -rf "$root"
            done
            for rpm in "$bundle"/rpm/*.rpm; do
              [ -f "$rpm" ] || continue
              echo "--- $rpm ---"
              rpm -qlp "$rpm" 2>/dev/null | grep -E '[.](desktop|nemo_action)$' || echo "(no rpm listing or no desktop entries)"
            done
            for entry in "$bundle"/appimage/*.AppDir/usr/share/applications/*.desktop; do
              [ -f "$entry" ] || continue
              echo "--- AppImage ${entry#"$bundle"/appimage/} ---"
              grep -E '^(Type|Exec|MimeType)=' "$entry" || echo "(no Type, Exec or MimeType line)"
            done
          done
          exit 0

  # Each tauri-action leg produces a complete latest.json candidate by merging
  # the release's current manifest. Those read/delete/upload operations are not
  # atomic across a matrix, so the last writer can otherwise lose a concurrent
  # platform. Preserve every leg's local candidate above, then retain only the
  # keys owned by that leg and publish one deterministic manifest after all five
  # builds succeed.
  finalize-updater:
    name: Finalize updater manifest (all targets)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download per-target updater fragments
        uses: actions/download-artifact@v8
        with:
          pattern: updater-fragment-*
          path: updater-fragments

      - name: Merge target-owned updater entries and upload canonical latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mac="updater-fragments/updater-fragment-aarch64-apple-darwin/latest.json"
          mac_x64="updater-fragments/updater-fragment-x86_64-apple-darwin/latest.json"
          windows="updater-fragments/updater-fragment-x86_64-pc-windows-msvc/latest.json"
          linux_x64="updater-fragments/updater-fragment-x86_64-unknown-linux-gnu/latest.json"
          linux_arm64="updater-fragments/updater-fragment-aarch64-unknown-linux-gnu/latest.json"
          fragments=("$mac" "$mac_x64" "$windows" "$linux_x64" "$linux_arm64")
          for fragment in "${fragments[@]}"; do
            test -s "$fragment" || { echo "missing updater fragment: $fragment" >&2; exit 1; }
            jq -e '.version and (.platforms | type == "object")' "$fragment" >/dev/null
          done
          metadata_variants="$(jq -c '[.version, .notes]' "${fragments[@]}" | sort -u | wc -l | tr -d ' ')"
          test "$metadata_variants" = 1 || {
            echo "updater fragments disagree on version or release notes" >&2
            exit 1
          }
          jq -n \
            --slurpfile mac "$mac" \
            --slurpfile mac_x64 "$mac_x64" \
            --slurpfile windows "$windows" \
            --slurpfile linux_x64 "$linux_x64" \
            --slurpfile linux_arm64 "$linux_arm64" '
              def owned($document; $prefix):
                $document.platforms
                | with_entries(select(.key | startswith($prefix)));
              {
                version: $mac[0].version,
                notes: $mac[0].notes,
                pub_date: ([$mac[0].pub_date, $mac_x64[0].pub_date, $windows[0].pub_date, $linux_x64[0].pub_date, $linux_arm64[0].pub_date] | max),
                platforms: (
                  owned($mac[0]; "darwin-aarch64")
                  + owned($mac_x64[0]; "darwin-x86_64")
                  + owned($windows[0]; "windows-x86_64")
                  + owned($linux_x64[0]; "linux-x86_64")
                  + owned($linux_arm64[0]; "linux-aarch64")
                )
              }
            ' > latest.json
          required=(
            darwin-aarch64 darwin-aarch64-app
            darwin-x86_64 darwin-x86_64-app
            windows-x86_64 windows-x86_64-msi windows-x86_64-nsis
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb
            linux-aarch64 linux-aarch64-appimage linux-aarch64-deb
          )
          case "$(jq -r .version latest.json)" in
            *-*) ;;
            *) required+=(linux-x86_64-rpm linux-aarch64-rpm) ;;
          esac
          for platform in "${required[@]}"; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "merged latest.json is missing platform: $platform" >&2; exit 1; }
          done
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attest updater manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: latest.json

  release-metadata:
    name: Attach and verify release supply-chain metadata
    needs: [build, finalize-updater]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download platform SBOMs
        uses: actions/download-artifact@v8
        with:
          pattern: release-sbom-*
          path: release-sboms
          merge-multiple: true

      - name: Attach SBOMs to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected=()
          for target in $RELEASE_TARGETS; do
            expected+=("release-sboms/Oleafly-${TAG}-${target}.spdx.json")
          done
          for sbom in "${expected[@]}"; do
            test -s "$sbom" || { echo "missing release SBOM: $sbom" >&2; exit 1; }
          done
          gh release upload "$TAG" "${expected[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --clobber
          while IFS= read -r -d '' asset; do
            case "$asset" in
              *.sig) continue ;;
            esac
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            case "$asset" in
              *.spdx.json|*/latest.json) ;;
              *)
                gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                  --predicate-type https://spdx.dev/Document/v2.3
                ;;
            esac
          done < <(find release-assets -type f -print0)

  # A tag must never yield a half-published release. Each matrix leg uploads its
  # own assets, so a leg that fails simply contributes nothing - which on its own
  # leaves a release carrying only the platforms that happened to succeed. These
  # two jobs make the outcome all-or-nothing.
  # Publishing writes latest.json, which is the updater feed: the moment a
  # release goes live, installed clients can pick it up automatically. There is
  # no undo for that, so pushing a tag builds and verifies a DRAFT and stops.
  # Publishing is a deliberate act - re-run this workflow via workflow_dispatch
  # for the same tag with "Publish the release" checked.
  publish:
    name: Publish (all platforms present)
    needs: [build, finalize-updater, release-metadata]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require every platform artifact, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=()
          # One representative artifact per supported architecture, plus the
          # updater feed. Architecture-specific names prevent one Linux build
          # from accidentally satisfying both checks.
          grep -qE '_aarch64\.dmg$'          <<<"$assets" || missing+=("macOS Apple Silicon .dmg")
          grep -qE '_x64\.dmg$'              <<<"$assets" || missing+=("macOS Intel .dmg")
          grep -qE '\.(msi|exe)$'            <<<"$assets" || missing+=("Windows .msi/.exe")
          grep -qE '_(amd64|x86_64)\.AppImage$' <<<"$assets" || missing+=("Linux x86_64 .AppImage")
          grep -qE '_(arm64|aarch64)\.AppImage$' <<<"$assets" || missing+=("Linux ARM64 .AppImage")
          grep -qE '_(amd64|x86_64)\.deb$'   <<<"$assets" || missing+=("Linux x86_64 .deb")
          grep -qE '_(arm64|aarch64)\.deb$'  <<<"$assets" || missing+=("Linux ARM64 .deb")
          grep -qE '^latest\.json$'          <<<"$assets" || missing+=("latest.json")
          for target in $RELEASE_TARGETS; do
            grep -qx "Oleafly-${TAG}-${target}.spdx.json" <<<"$assets" \
              || missing+=("${target} SBOM")
          done
          if ((${#missing[@]})); then
            printf 'refusing to publish %s; missing: %s\n' "$TAG" "${missing[*]}" >&2
            exit 1
          fi
          # The updater feed must offer every platform too, or clients on a
          # missing one silently never see the release.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -D . --clobber
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "latest.json is missing platform: $platform" >&2; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG with all platform artifacts"

  # Lists the new version in the MCP Registry and attaches oleafly.mcpb. The
  # release is live by now, so a failure here leaves it as it is; run
  # mcp-registry.yml by hand for the same tag to retry.
  mcp-registry:
    name: MCP registry
    needs: publish
    if: ${{ inputs.publish == true }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  # A draft handed over for review still has to be complete, so it gets the same
  # artifact and updater-feed checks as a publish - it just never flips live.
  draft-ready:
    name: Draft is complete (not published)
    needs: [build, finalize-updater, release-metadata]
    if: ${{ always() && inputs.publish != true }}
    runs-on: ubuntu-22.04
    permissions:
      # A draft release is only visible to a token with push access, so
      # contents:read cannot see it and `gh release view` fails with
      # "release not found". This job only reads, but write is what makes the
      # draft visible at all.
      contents: write
    steps:
      - name: Require every platform artifact, then stop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs['finalize-updater'].result }}" != "success" ] || [ "${{ needs['release-metadata'].result }}" != "success" ]; then
            echo "build, updater finalization, or release metadata did not succeed; the draft is incomplete" >&2
            exit 1
          fi
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=()
          grep -qE '_aarch64\.dmg$'          <<<"$assets" || missing+=("macOS Apple Silicon .dmg")
          grep -qE '_x64\.dmg$'              <<<"$assets" || missing+=("macOS Intel .dmg")
          grep -qE '\.(msi|exe)$'            <<<"$assets" || missing+=("Windows .msi/.exe")
          grep -qE '_(amd64|x86_64)\.AppImage$' <<<"$assets" || missing+=("Linux x86_64 .AppImage")
          grep -qE '_(arm64|aarch64)\.AppImage$' <<<"$assets" || missing+=("Linux ARM64 .AppImage")
          grep -qE '_(amd64|x86_64)\.deb$'   <<<"$assets" || missing+=("Linux x86_64 .deb")
          grep -qE '_(arm64|aarch64)\.deb$'  <<<"$assets" || missing+=("Linux ARM64 .deb")
          grep -qE '^latest\.json$'          <<<"$assets" || missing+=("latest.json")
          for target in $RELEASE_TARGETS; do
            grep -qx "Oleafly-${TAG}-${target}.spdx.json" <<<"$assets" \
              || missing+=("${target} SBOM")
          done
          if ((${#missing[@]})); then
            printf 'draft %s is incomplete; missing: %s\n' "$TAG" "${missing[*]}" >&2
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -D . --clobber
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "latest.json is missing platform: $platform" >&2; exit 1; }
          done
          echo "$TAG is a complete, verified draft; re-run this workflow with publish=true to release it"

  guard-incomplete:
    name: Keep an incomplete release unpublished
    needs: [build, finalize-updater, release-metadata, publish]
    if: always() && inputs.publish == true && (needs.build.result != 'success' || needs['finalize-updater'].result != 'success' || needs['release-metadata'].result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Force the release back to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
            echo "kept $TAG as a draft: not every platform produced artifacts"
          fi
          exit 1
